# Shared training contract for the PRM 2^3 architecture factorial.
model: v2
data_path: data/processed/cleaned_dataset.pkl
output_dir: factorial/placeholder
split_path: artifacts/prm_protocol_v1/splits/id_repeat_s42.json
seed: 142
batch_size: 64
epochs: 150
loss: mae
grad_clip: 5.0
online_aug: false
host_balanced: true
samples_per_host: 200
label_noise_std: 0.03
pretrained_embed: results/pretrain_dft3d/pretrained_embed.pt
scheduler_type: cosine
warmup_epochs: 10
optimizer:
  lr: 5.0e-4
  weight_decay: 1.0e-4
scheduler:
  eta_min: 1.0e-6
model_kwargs:
  atom_fea_len: 9
  hidden_dim: 128
  n_local_layers: 3
  n_global_layers: 2
  num_heads: 4
  rcut_local: 5.0
  dmax_global: 12.0
  defect_embedding: true
  dropout: 0.1
  ct_uae_path: data/ct_uae_mt3_embeddings.pt
  use_gated_pooling: false
  use_env_enrichment: false
  use_prenorm_local: false
