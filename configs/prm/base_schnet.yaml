model: pbc_schnet
data_path: data/processed/cleaned_dataset.pkl
output_dir: baselines/schnet/placeholder
split_path: artifacts/prm_protocol_v1/splits/id_repeat_s42.json
seed: 342
batch_size: 32
num_workers: 4
cpu_threads: 8
epochs: 150
grad_clip: 5.0
online_aug: false
host_balanced: true
samples_per_host: 200
label_noise_std: 0.03
lr: 5.0e-4
weight_decay: 1.0e-4
warmup_epochs: 10
eta_min: 1.0e-6
model_kwargs:
  hidden_channels: 128
  num_filters: 128
  num_interactions: 6
  num_gaussians: 50
  cutoff: 5.0
  readout: add
