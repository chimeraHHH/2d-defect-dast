# CrystalTransformerV2: Wider model (h=192 vs h=128)
# Hypothesis: more representation capacity per layer improves accuracy
# Increased regularization (dropout, weight decay) to prevent overfitting
model: v2
data_path: data/processed/cleaned_dataset.pkl
output_dir: results/v2_wider
seed: 42
batch_size: 48
epochs: 200
train_ratio: 0.8
val_ratio: 0.1
loss: mae
grad_clip: 5.0
online_aug: true
online_aug_cfg:
  sigma_range: [0.01, 0.05]
  strain_range: 2.0
  rotate_prob: 1.0
  perturb_prob: 0.8
  strain_prob: 0.3
host_balanced: true
samples_per_host: 200
aux_defect_weight: 0.1
drop_path_rate: 0.15
label_noise_std: 0.03
use_swa: true
swa_start_epoch: 160
swa_lr: 1.0e-4
pretrained_embed: results/pretrain_dft3d/pretrained_embed.pt
scheduler_type: cosine
warmup_epochs: 15
optimizer:
  lr: 4.0e-4
  weight_decay: 2.0e-4
scheduler:
  eta_min: 1.0e-6
model_kwargs:
  atom_fea_len: 9
  hidden_dim: 192
  n_local_layers: 3
  n_global_layers: 2
  num_heads: 6
  rcut_local: 5.0
  dmax_global: 12.0
  defect_embedding: true
  dropout: 0.15
  ct_uae_path: data/ct_uae_mt3_embeddings.pt
  use_gated_pooling: true
  use_env_enrichment: true
  use_prenorm_local: true
