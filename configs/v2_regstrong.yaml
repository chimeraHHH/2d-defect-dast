# CrystalTransformerV2: Stronger regularization
# Rationale: Current V2 shows 2.4x train/val MAE gap (0.16 vs 0.38),
# indicating significant overfitting. This config increases all
# regularization knobs simultaneously:
#   - dropout: 0.15 (vs 0.10 baseline)
#   - weight_decay: 2.0e-4 (vs 1.0e-4)
#   - drop_path_rate: 0.15 (vs 0.10)
#   - label_noise_std: 0.05 (vs 0.03)
#   - stronger augmentation: sigma_range [0.02, 0.08], strain_range 3.0
# If train MAE rises but val MAE drops, we know overfitting was the bottleneck.
model: v2
data_path: data/processed/cleaned_dataset.pkl
output_dir: results/v2_regstrong
seed: 42
batch_size: 64
epochs: 150
train_ratio: 0.8
val_ratio: 0.1
loss: mae
grad_clip: 5.0
online_aug: true
online_aug_cfg:
  sigma_range: [0.02, 0.08]
  strain_range: 3.0
  rotate_prob: 1.0
  perturb_prob: 0.9
  strain_prob: 0.4
host_balanced: true
samples_per_host: 200
aux_defect_weight: 0.1
drop_path_rate: 0.15
label_noise_std: 0.05
use_swa: true
swa_start_epoch: 120
swa_lr: 1.0e-4
pretrained_embed: results/pretrain_dft3d/pretrained_embed.pt
scheduler_type: cosine
warmup_epochs: 10
optimizer:
  lr: 5.0e-4
  weight_decay: 2.0e-4
scheduler:
  eta_min: 1.0e-6
model_kwargs:
  atom_fea_len: 9
  hidden_dim: 128
  n_local_layers: 3
  n_global_layers: 2
  num_heads: 4
  rcut_local: 5.0
  dmax_global: 12.0
  defect_embedding: true
  dropout: 0.15
  ct_uae_path: data/ct_uae_mt3_embeddings.pt
  use_gated_pooling: true
  use_env_enrichment: true
  use_prenorm_local: true
